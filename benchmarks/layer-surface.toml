# Benchmark graph layer surfaces.
#
# A stored benchmark graph is kept in layers (ingest, then post-ingest passes). Each layer is
# marked by the last Menhir commit that changed any file listed for it here, and a stored layer
# is reused only when that commit is unchanged. Recall is not stored; its surface is recorded
# per run. Plan: archolith-bench P8a (workspace .agent/plans/archolith-bench-graph-store-p8a-plan-2026-11-21.md).
#
# tests/test_bench_layer_surface.py fails when this file stops matching the code:
#   - a glob or path matches nothing, or an entry module is missing (moved, renamed, deleted);
#   - a file in a layer imports a menhir module that is neither in the layer nor reviewed under
#     [[layers.<name>.outside]] (code moved out of the layer into a new or unlisted module);
#   - an `outside` group has no reason, or names a module that no longer exists.
#
# Bias: BROAD. An extra file costs a rebuild; a missing one silently reuses a stale graph.
# Known gap: imports done by string (importlib, settings-selected providers) are invisible to the
# check and must be listed by hand. Non-Python inputs (the dependency lock, which pins the
# Graphiti fork) go under `paths`.

version = 1


