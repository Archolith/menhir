[pytest]
addopts = -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = src
cache_dir = .tmp_pytest_cache
# Hard per-test safety net: a single hanging test fails after 60s instead of
# stalling the whole run indefinitely (see the 2026-07-11 SSOT review's
# unresolved "68 tests then no progress for 120-300s" suite-hang report).
# thread method works on Windows (the signal method does not).
timeout = 60
timeout_method = thread
markers =
    unit: Fast tests that don't depend on external services like Neo4j (deselect with '-m \"not unit\"')
    online: Tests that require a live Neo4j or LLM connection; skipped unless '--run-online' is passed
    needs_llm: An 'online' test that additionally requires a reachable LLM/embedder. CI supplies a
        Neo4j service container but NO LLM, so it selects '-m "online and not needs_llm"'. Mark a
        test with this ONLY if it cannot skip cleanly on its own when the LLM is absent -- a test
        with a working skip-guard needs no marker. Unmarked LLM tests HANG in the chat-completion
        retry/backoff path until pytest-timeout kills the run.
    smoke: Quick tests intended to verify basic functionality of paths
    replay: Multi-step replay scenario tests
