mcp:
  # Display groups for docs and the explorer. Access is granted by profiles below.
  groups:
    ingest:
      ids: [mcp.tool.add_memory, mcp.tool.add_memory_and_track]
    processing:
      ids: [mcp.tool.get_enrichment_status, mcp.tool.watch_enrichment, mcp.tool.get_episode_trace, mcp.tool.list_enrichment_queue, mcp.tool.repair_stale_enrichment, mcp.tool.force_reenrich, mcp.tool.force_release_enrichment_lease]
    conflicts:
      ids: [mcp.tool.list_conflicts, mcp.tool.resolve_conflict, mcp.tool.scan_for_conflicts, mcp.tool.run_llm_conflict_review, mcp.tool.requeue_conflicts_for_llm_review]
    recall:
      ids: [mcp.tool.read_flagged_memories, mcp.tool.recall_context_memories, mcp.tool.recall_history, mcp.tool.recall_memories]
    context:
      ids: [mcp.tool.build_context]
    stats:
      ids: [mcp.tool.get_memory_stats]
    feedback:
      # Self-reported recall usefulness (R8 agent_inference grade; dashboard signal only,
      # never feeds memory heat/promotion). Surfaced in the explorer Feature Usage page.
      ids: [mcp.tool.rate_recall]
    operator:
      ids: [mcp.tool.force_scheduler_takeover, mcp.tool.flag_memory, mcp.tool.delete_memory, mcp.tool.recover_orphans]
  # Generated from src/menhir/mcp/tool_profiles.py; tests/test_tool_profiles.py fails on drift.
  profiles:
    catalog_version: 4
    core:
      ids: [mcp.tool.add_memory, mcp.tool.add_todo, mcp.tool.build_context, mcp.tool.close_stale_todos, mcp.tool.close_todo, mcp.tool.get_beacon_evidence, mcp.tool.get_client_context, mcp.tool.get_provenance, mcp.tool.get_scalar_view_items, mcp.tool.get_todo, mcp.tool.list_todos, mcp.tool.query_structure, mcp.tool.read_flagged_memories, mcp.tool.recall_context_memories, mcp.tool.recall_history, mcp.tool.recall_memories, mcp.tool.recall_timeline]
    curate:
      ids: [mcp.tool.acknowledge_warning, mcp.tool.add_candidate, mcp.tool.add_memory_and_track, mcp.tool.audit_artifact_corpus, mcp.tool.close_memory, mcp.tool.delete_memories, mcp.tool.delete_memory, mcp.tool.flag_memory, mcp.tool.get_artifact, mcp.tool.get_artifact_relationships, mcp.tool.ingest_document, mcp.tool.ingest_project, mcp.tool.link_artifacts, mcp.tool.link_memory_to_todo, mcp.tool.list_artifact_questions, mcp.tool.list_artifacts, mcp.tool.list_candidates, mcp.tool.list_conflicts, mcp.tool.list_namespace_memories, mcp.tool.promote_memory, mcp.tool.rate_recall, mcp.tool.relocate_artifact_source, mcp.tool.reopen_todo, mcp.tool.requeue_conflicts_for_llm_review, mcp.tool.resolve_conflict, mcp.tool.resolve_todo, mcp.tool.review_candidate, mcp.tool.review_inbox, mcp.tool.run_llm_conflict_review, mcp.tool.scan_for_conflicts, mcp.tool.supersede_artifact, mcp.tool.supersede_todo, mcp.tool.transition_artifact, mcp.tool.unflag_memory]
    operate:
      ids: [mcp.tool.force_reenrich, mcp.tool.force_release_enrichment_lease, mcp.tool.force_scheduler_takeover, mcp.tool.get_enrichment_status, mcp.tool.get_episode_trace, mcp.tool.get_memory_stats, mcp.tool.list_enrichment_queue, mcp.tool.pause_scheduler, mcp.tool.recover_orphans, mcp.tool.repair_stale_enrichment, mcp.tool.resume_scheduler, mcp.tool.view_entropy, mcp.tool.watch_enrichment]
    admin:
      ids: [mcp.tool.delete_namespace, mcp.tool.list_clients, mcp.tool.mint_client, mcp.tool.revoke_client]
  resources:
    system:
      ids: [mcp.resource.system.dependency_health, mcp.resource.system.metadata, mcp.resource.system.lifecycle_trace, mcp.resource.system.processing_queue]
    memory:
      ids: [mcp.resource.memory.recent, mcp.resource.memory.node, mcp.resource.memory.scope, mcp.resource.memory.search, mcp.resource.memory.type]
