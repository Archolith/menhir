# Throwaway Neo4j for the online test suite.
#
# Online tests MUST NOT run against the operator's real graph. They execute unscoped,
# destructive queries (apply_decay rewrites sharpness/edge counts across all nodes and can
# compress across the whole database), so pointing them at the live instance destroys real
# memories. This stands up an isolated instance on different ports with NO persistent
# volume -- its data is ephemeral by construction.
#
#   Up:   docker compose -f docker-compose.test.yml up -d
#   Down: docker compose -f docker-compose.test.yml down -v
#
# Then: MENHIR_TEST_NEO4J_URI=bolt://localhost:7688 pytest --run-online

services:
  neo4j-test:
    image: neo4j:5-community
    container_name: menhir-neo4j-test
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["apoc"]'
      # Keep it small; this is a scratch instance.
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7475:7474"   # Browser UI  (prod uses 7474)
      - "7688:7687"   # Bolt        (prod uses 7687)
    tmpfs:
      # Ephemeral storage: nothing survives a container restart, so a test run can never
      # accumulate state or be mistaken for the real graph.
      - /data
      - /logs
