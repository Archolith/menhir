# Separate ingress project for installations that publish Menhir with a
# locally-managed Cloudflare Tunnel instead of the shared Caddy origin.
services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: menhir-prod-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /srv/menhir/production/ingress/cloudflared-config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
      - type: bind
        source: /srv/menhir/production/secrets/cloudflare/credentials.json
        target: /etc/cloudflared/credentials.json
        read_only: true
    networks:
      menhir-proxy:
        # This is also the only trusted proxy peer in the Menhir app config.
        ipv4_address: 172.30.0.2
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
          pids: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  menhir-proxy:
    external: true
