[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-menhir"
version = "0.2.0"
description = "Evidence-backed graph memory and code-impact analysis for coding agents."
readme = "README.md"
maintainers = [{ name = "Archolith", email = "contact@archolith.dev" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.txt"]
requires-python = ">=3.12"
dependencies = [
    "graphiti-core>=0.29.2,<0.30",
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "jinja2>=3.1,<4",
    "archolith-mcp-framework @ git+https://github.com/Archolith/archolith-mcp-framework.git@v0.2.0",
    "archolith-oauth @ git+https://github.com/Archolith/archolith_oauth.git@8b63905ab97770bf4afbfbc0b65f209fec37dc09",
    "fastmcp>=3.2.4,<4",
    "neo4j>=6.2,<7",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
    "rich>=13.9,<16",
    "starlette>=1.0.1,<2",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
    "joserfc>=1.0,<2",
]

[project.urls]
Homepage = "https://archolith.dev"
Repository = "https://github.com/Archolith/menhir"
Documentation = "https://github.com/Archolith/menhir#readme"
Issues = "https://github.com/Archolith/menhir/issues"
Security = "https://github.com/Archolith/menhir/security/policy"

[project.scripts]
menhir = "menhir.main:main"

[tool.setuptools.package-data]
"menhir.explorer" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.coverage.run]
# CF-140: every coverage figure this programme has reported came from a run WITHOUT --branch, so
# `coverage.xml` carried branches-valid="0" and every quoted rate was line-only. A line rate counts
# a guard clause covered the moment its body runs once, which is precisely the shape this codebase
# keeps finding defects in -- an untaken `if` that nobody exercised.
#
# Set here rather than in a command line so it applies however coverage is invoked. The previous
# figures were ad hoc runs, which is how the flag went missing in the first place.
branch = true
source = ["src/menhir"]

[tool.coverage.report]
# Surfacing partial branches is the point: a file at 100% line coverage with unexercised branches
# should not read as fully covered.
skip_covered = false
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]
