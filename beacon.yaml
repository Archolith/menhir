agent_guidance:
  read_first:
    - AGENTS.md
    - .agent/README.md
    - README.md
  safe_first_tasks:
    - add a focused regression test for a documented behavior
    - fix a documentation route in .agent/README.md that points at a missing file
    - add a default-off feature row to .agent/default-off-features.md when one ships
  avoid_without_review:
    - project identity binding and the structure write fence
    - the production client policy, the access contract and its canonical digest
    - authentication modes, credential tiers and ingest path containment
    - memory lifecycle, promotion and governance rules
    - turning on a default-off feature
    - anything that deletes or merges graph data
    - deployment and release tooling under deploy/
  expected_behavior:
    - read .agent/README.md as a router; do not preload all of .agent/
    - confirm the project in query_structure projects, then run blast_radius once per file before editing it
    - treat an empty or stale structural answer as inconclusive, not as proof of no impact
    - extend the canonical backend and MCP contracts instead of adding parallel paths
    - run the smallest credible tests plus matching ruff checks; required CI runs the complete suite
    - report commands actually run, and name the lanes that were not run
    - update the owning .agent doc and add a CHANGELOG entry for meaningful changes
    - stage files explicitly and never commit secrets

build_and_test:
  setup: python -m pip install -e . --group dev
  test: python -m pytest tests/<changed_area> -q
  benchmark: ''

guardrails:
  - id: no_project_writes
    scope: indexed_projects
    severity: high
    rule: >
      Menhir never creates, changes or deletes files inside a project it indexes. Identity lives
      in the graph; beacons are built and written by Beacon.
    applies_to:
      - src/menhir/services/project_identity_service.py
      - src/menhir/infrastructure/project_scanner.py
    sources:
      - type: doc
        title: Menhir as a Beacon memory provider
        path: docs/agent-usage.md
        status: current

  - id: incomplete_index_is_inconclusive
    scope: structure_queries
    severity: high
    rule: >
      An unindexed path, an incomplete index or a stale anchor makes a result inconclusive. Never
      report an empty blast radius or an empty affected-test set as proof that nothing depends on
      a change; check the current code.
    applies_to:
      - src/menhir/infrastructure/structure_queries.py
    sources:
      - type: doc
        title: Agent instructions
        path: AGENTS.md
        status: current
      - type: doc
        title: Code graph and blast radius
        path: README.md
        status: current

  - id: stale_anchors_are_advisory
    scope: hook_center
    severity: medium
    rule: >
      A stale-anchor label is advisory. File events mark files dirty; they never delete, downrank
      or re-anchor a memory, rebuild the index or clear dirty state automatically, and a
      verification receipt changes the advisory without clearing staleness.
    applies_to:
      - src/menhir/services/stale_labeling.py
    sources:
      - type: doc
        title: Hook Center / tool event capture
        path: docs/hook-center-tool-events.md
        status: current

  - id: capture_is_not_transcript_logging
    scope: agent_hooks
    severity: high
    rule: >
      Producers keep only triage-accepted user prompts and file paths with change metadata: never
      assistant turns, tool output, full transcripts or file contents. They call no LLM, fail
      open, never block the host agent, and are never installed by setup without an explicit
      choice.
    applies_to:
      - scripts/hooks/menhir_turn_evidence_common.py
    sources:
      - type: doc
        title: TurnEvidence producers
        path: docs/turn-evidence-producers.md
        status: current
      - type: doc
        title: Post-install setup
        path: docs/post-install.md
        status: current

  - id: client_policy_census
    scope: mcp_tool_surface
    severity: high
    rule: >
      Adding, removing or renaming an MCP tool changes the tool census: update the access
      contract and every client in the production client policy, and recompute its canonical
      digest, or production refuses to start.
    applies_to:
      - src/menhir/access_contract.py
      - deploy/client-policy.production.json
    sources:
      - type: file
        title: Production client policy
        path: src/menhir/api/client_policy.py
        status: current

  - id: no_auth_only_on_loopback
    scope: http_surface
    severity: high
    rule: >
      With no key configured the server serves an unauthenticated API on loopback only and
      refuses a non-loopback bind. MENHIR_ALLOW_INSECURE_REMOTE_NO_AUTH is unsafe and for
      isolated lab networks only. Each configured key must be distinct, and automated clients get
      the least tier that works.
    applies_to:
      - src/menhir/api/auth_mode.py
    sources:
      - type: doc
        title: Security posture
        path: docs/security-posture.md
        status: current

  - id: ingest_path_containment
    scope: ingest
    severity: high
    rule: >
      agent and readonly callers may ingest only under MENHIR_INGEST_ALLOWED_ROOTS, which has no
      default. Paths under logs/, backups/ or .git/ are refused for every tier, operator
      included, and .env files are refused.
    applies_to:
      - src/menhir/core/ingest_guard.py
    sources:
      - type: doc
        title: Security posture
        path: docs/security-posture.md
        status: current

  - id: default_off_needs_evidence
    scope: runtime_defaults
    severity: medium
    rule: >
      Features shipped default-off stay off until an owner decides, on recorded evidence, to
      activate them. Read-side experiments that were neutral or negative stay disabled. Record
      every new default-off feature and every activation in the ledger.
    sources:
      - type: doc
        title: Default-off activation ledger
        path: .agent/default-off-features.md
        status: current
      - type: doc
        title: Evaluation posture
        path: docs/evaluation.md
        status: current

  - id: benchmark_publication
    scope: evaluation
    severity: medium
    rule: >
      Publish a benchmark number only when a current benchmark authority names the dataset
      variant, command, source commit, date, method, baseline and evidence artifact. There is no
      active public headline number.
    sources:
      - type: doc
        title: Evaluation posture
        path: docs/evaluation.md
        status: current

  - id: disposable_test_graph
    scope: tests
    severity: high
    rule: >
      Online tests run destructive, unscoped graph queries. Run them only against a disposable
      Neo4j, never an operator or production graph, and only with explicit opt-in.
    sources:
      - type: doc
        title: Run and test
        path: .agent/workflows/run_and_test.md
        status: current

  - id: ci_before_publication
    scope: release
    severity: high
    rule: >
      Production publication or promotion stays blocked until every required CI check for that
      exact commit is green. Do not run the complete suite locally as a routine step.
    sources:
      - type: doc
        title: Agent instructions
        path: AGENTS.md
        status: current
      - type: doc
        title: Run and test
        path: .agent/workflows/run_and_test.md
        status: current

  - id: artifact_moves_keep_identity
    scope: work_artifacts
    severity: medium
    rule: >
      A tracked plan, review, handoff or report keeps its UUID when moved and gets a new one when
      copied; archiving needs an explicit terminal status. Run menhir artifacts validate . before
      committing.
    sources:
      - type: doc
        title: Maintenance
        path: .agent/maintenance.md
        status: current
      - type: doc
        title: Creating and moving work artifacts
        path: .agent/workflows/artifact_authoring.md
        status: current

  - id: no_secrets
    scope: repository
    severity: high
    rule: >
      Keep LLM, embedding, Neo4j and auth configuration in environment variables. Never commit or
      record secrets, and report vulnerabilities privately.
    sources:
      - type: doc
        title: Security policy
        path: SECURITY.md
        status: current
      - type: doc
        title: Agent instructions
        path: AGENTS.md
        status: current

project_state:
  active_work:
    title: Local-stdio MVP release
    summary: >
      A local, single-operator coding-agent service over MCP stdio covering memory,
      WorkArtifacts, local code ingest and structure, todos and Beacon support, closed by an
      independent audit, black-box E2Es and a fresh full-Oracle LongMemEval gate on a named
      release candidate.
    next_step: Finish the phase checklists in the release plan and freeze a release candidate.
    sources:
      - type: doc
        title: Local-stdio MVP release plan
        path: .agent/plans/menhir-local-stdio-mvp-release-2026-09-16.md
        status: current
      - type: issue
        title: Local-stdio MVP tracker
        url: https://github.com/Archolith/menhir/issues/123
        status: current
  recently_completed:
    - title: Menhir serves Beacon evidence by project id or repository origin
      summary: >
        get_beacon_evidence reads the graph only and returns bound beacon-memory-evidence-1.1.
      sources:
        - type: doc
          title: Menhir as a Beacon memory provider
          path: docs/agent-usage.md
          status: current
    - title: Project identity lives only in the graph
      summary: Menhir no longer writes an identity file into indexed checkouts.
      sources:
        - type: doc
          title: Menhir as a Beacon memory provider
          path: docs/agent-usage.md
          status: current
  blockers:
    - title: Deployment control plane is NOT READY
      summary: >
        Deployment implementation and production work are frozen until the recovery plan's
        architecture is independently accepted.
      sources:
        - type: doc
          title: Deployment recovery plan
          path: .agent/plans/menhir-deployment-control-plane-architecture-reset-2026-09-08.md
          status: current
  pending_decisions:
    - title: Retire menhir beacon generate
      summary: >
        The older generation path stays until Beacon's end-to-end lane runs against the provider.
      sources:
        - type: doc
          title: Menhir as a Beacon memory provider
          path: docs/agent-usage.md
          status: current
    - title: Context composition stages 2 to 4
      summary: >
        Decide whether they are still wanted after Stage 1's negative result.
      sources:
        - type: doc
          title: Current plan index
          path: .agent/plans/README.md
          status: current
