name: core-promotion-3-validation

on:
  push:
    branches:
      - research/core-promotion-3

jobs:
  focused-admission-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7688:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout menhir
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pytest-xdist pytest-timeout

      - name: Verify test Neo4j is reachable
        run: |
          python - <<'PY'
          from neo4j import GraphDatabase
          drv = GraphDatabase.driver("bolt://localhost:7688", auth=("neo4j", "testpassword"))
          drv.verify_connectivity()
          with drv.session() as s:
              print("neo4j ok:", s.run("RETURN 1 AS ok").single()["ok"])
          drv.close()
          PY

      - name: Run promotion tranche 3 tests
        env:
          MENHIR_TEST_NEO4J_URI: bolt://localhost:7688
          MENHIR_TEST_NEO4J_USER: neo4j
          MENHIR_TEST_NEO4J_PASSWORD: testpassword
          MENHIR_TEST_NEO4J_DATABASE: neo4j
        run: >-
          pytest -q --run-online
          tests/test_admission_contract.py
          tests/test_admission_semantics_ownership.py
          tests/test_turn_evidence.py
          tests/test_scalar_view_authority.py
          tests/test_scalar_view_authority_phase_d.py
          tests/test_scalar_state_fold.py
          tests/test_typed_scalar_gate.py
          tests/test_scalar_turnevidence_foundation_live.py
          tests/test_scalar_turnevidence_discovery_live.py
