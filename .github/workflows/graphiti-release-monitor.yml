name: Graphiti release monitor

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Assess releases without creating or updating an issue
        required: true
        default: true
        type: boolean

concurrency:
  group: graphiti-release-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Menhir
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assess upstream releases
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/graphiti-monitor.json
        run: >-
          python scripts/maintenance/graphiti_release_monitor.py
          --repository-root .
          --output "$RESULT_PATH"
          --github-output "$GITHUB_OUTPUT"
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh the version-specific upgrade plan
        if: >-
          steps.assess.outputs.actionable == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/graphiti-monitor.json
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
            const planned = report.issue;
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: "graphiti-release-monitor" });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "graphiti-release-monitor",
                color: "6f42c1",
                description: "Version-specific Graphiti compatibility review generated by the release monitor",
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              labels: "graphiti-release-monitor",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && (issue.body || "").includes(planned.marker)
            );

            if (existing?.state === "closed") {
              core.info(`Issue #${existing.number} is closed; preserving the owner's disposition.`);
              return;
            }
            if (existing) {
              if (existing.title !== planned.title || existing.body !== planned.body) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title: planned.title,
                  body: planned.body,
                });
                core.info(`Refreshed Graphiti upgrade plan issue #${existing.number}.`);
              } else {
                core.info(`Graphiti upgrade plan issue #${existing.number} is already current.`);
              }
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: planned.title,
              body: planned.body,
              labels: ["graphiti-release-monitor"],
            });
            core.info(`Created Graphiti upgrade plan issue #${created.data.number}.`);
