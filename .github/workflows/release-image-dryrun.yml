name: release image dry run

# Builds, scans, seals and re-verifies the release image exactly as a release does, on every
# runner a release may use, and never logs in, pushes or attests (#613). v0.2.x burned PyPI
# versions when the image job first failed at release time; scripts/release.py now refuses
# `--tag` unless a run of this workflow is green on the exact commit (#614).
on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-image.yml"
      - ".github/workflows/release-image-dryrun.yml"
      - ".github/workflows/publish-pypi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-dryrun-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve pinned Python base
    if: ${{ github.repository == 'Archolith/menhir' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      python_base: ${{ steps.base.outputs.python_base }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read deploy/release-python-base.txt
        id: base
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "deploy")
          from release_pipeline import read_python_base

          base = read_python_base(Path("deploy/release-python-base.txt"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as output:
              output.write(f"python_base={base}\n")
          PY

  image:
    name: dry run ${{ matrix.runner }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read
    uses: ./.github/workflows/release-image.yml
    with:
      version: 0.0.0-${{ github.run_number }}
      image: ghcr.io/archolith/menhir
      python_base: ${{ needs.resolve.outputs.python_base }}
      push: false
      runner: ${{ matrix.runner }}
