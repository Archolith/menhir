name: Publish to PyPI

# Publishes archolith-menhir on a v* tag, using PyPI trusted publishing. Modelled on the
# workflow already producing releases for archolith-mcp-framework and archolith-oauth.
#
# Requires, once, before the first tag: a PyPI trusted publisher for this repository
# (project archolith-menhir, workflow publish-pypi.yml, environment pypi) and a `pypi`
# environment on the repo.
#
# The test suite is NOT re-run here. tests.yml gates every push to main -- including the
# commit a release tag points at -- and it needs a Neo4j service container for its
# integration job. Duplicating that in the release path buys nothing and gives a release two
# ways to fail. What this workflow does verify is the thing tests.yml cannot see: that the
# built artifacts are installable, correctly versioned, and expose the entry points users
# depend on.

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag/version mismatch: tag={actual!r}, expected={expected!r}")
          PY

      - name: Refuse to release with a dependency resolved from a repository
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          deps = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["dependencies"]
          vcs = [d for d in deps if "@" in d and "://" in d]
          if vcs:
              # A wheel whose metadata names a git URL cannot be installed by `pip install
              # archolith-menhir` on a machine without git, and its content is not hashable.
              raise SystemExit(f"non-PyPI dependencies would ship in the wheel metadata: {vcs}")
          PY

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine check-wheel-contents
          python -m build
          python -m twine check dist/*
          check-wheel-contents --ignore W009 dist/*.whl

      - name: Smoke the installed wheel
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/python - <<'PY'
          import importlib.metadata
          import os

          import menhir

          expected = os.environ["RELEASE_TAG"].lstrip("v")
          installed = importlib.metadata.version("archolith-menhir")
          if installed != expected:
              raise SystemExit(f"wheel/tag mismatch: installed={installed!r}, expected={expected!r}")
          if menhir.__version__ != expected:
              raise SystemExit(f"menhir.__version__={menhir.__version__!r}, expected {expected!r}")
          PY
          # The entry points a user touches first. `menhir --help` exercises the Typer app and
          # every import behind it; `check` proves the CLI runs outside a source checkout,
          # which is the whole point of shipping to PyPI (exit status is ignored -- there is no
          # configuration on a CI runner, so it reports MISS lines and that is correct).
          .smoke/bin/menhir --help > /dev/null
          .smoke/bin/menhir check || true
          .smoke/bin/python -m pip check

      - name: Record distribution checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload distribution checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: trusted publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/archolith-menhir/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: checksums

      - name: Create immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* checksums/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
