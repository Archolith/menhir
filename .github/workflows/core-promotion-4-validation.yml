name: core-promotion-4-validation

on:
  push:
    branches:
      - research/core-promotion-4

jobs:
  focused-projection-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout menhir
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pytest-timeout ruff

      - name: Static-check tranche files
        run: >-
          ruff check --select F
          src/menhir/domain/projection.py
          src/menhir/services/scalar_projection_definition.py
          tests/domain/test_projection_registry.py
          tests/test_scalar_projection_definition.py

      - name: Run projection and compatibility tests
        run: >-
          pytest -q
          tests/domain/test_projection_registry.py
          tests/test_scalar_projection_definition.py
          tests/test_scalar_state_fold.py
          tests/test_fold_algebra.py
          tests/infrastructure/test_view_kind_registration.py
          tests/domain/test_evidence_kind_registry.py
          tests/test_admission_contract.py
          tests/test_admission_semantics_ownership.py
