name: release image

on:
  workflow_call:
    inputs:
      version:
        description: Release version embedded in image labels (<major>.<minor>.<patch>-<sequence>)
        required: true
        type: string
      image:
        description: GHCR image repository without a tag or digest
        required: true
        type: string
      ref:
        description: Git ref to validate; defaults to the triggering commit
        required: false
        type: string
        default: ""
      python_base:
        description: Digest-pinned Python base image
        required: true
        type: string
      push:
        description: Publish the sealed candidate after validation and approval
        required: false
        type: boolean
        default: false
      syft_image:
        description: Digest-pinned Syft v1.51.1 Linux amd64 scanner image
        required: false
        type: string
        default: "docker.io/anchore/syft@sha256:600896ff278677fb13b16dc35999452f4e79636fc098c9fee6ce3cffef9858e2"
      grype_image:
        description: Digest-pinned Grype v0.118.0 Linux amd64 scanner image
        required: false
        type: string
        default: "docker.io/anchore/grype@sha256:461c87fefcd20d133f4d99db4623608637eecb439045f9fc8d6eebbb4149e766"
    outputs:
      validation_metadata_artifact:
        description: Artifact containing the sealed image, identity, metadata, and evidence
        value: ${{ jobs.validate.outputs.metadata_artifact }}
      publication_metadata_artifact:
        description: Artifact containing publication metadata and bound evidence
        value: ${{ jobs.publish.outputs.metadata_artifact }}
      image_ref:
        description: Published digest-pinned image reference; empty when push is false
        value: ${{ jobs.publish.outputs.image_ref }}
      registry_digest:
        description: Published registry manifest digest; empty when push is false
        value: ${{ jobs.publish.outputs.registry_digest }}
  workflow_dispatch:
    inputs:
      version:
        description: Release version embedded in image labels (<major>.<minor>.<patch>-<sequence>)
        required: true
        type: string
      image:
        description: GHCR image repository without a tag or digest
        required: true
        type: string
      ref:
        description: Git ref to validate; defaults to the triggering commit
        required: false
        type: string
        default: ""
      python_base:
        description: Digest-pinned Python base image
        required: true
        type: string
      push:
        description: Publish the sealed candidate after validation and approval
        required: false
        type: boolean
        default: false
      syft_image:
        description: Digest-pinned Syft v1.51.1 Linux amd64 scanner image
        required: false
        type: string
        default: "docker.io/anchore/syft@sha256:600896ff278677fb13b16dc35999452f4e79636fc098c9fee6ce3cffef9858e2"
      grype_image:
        description: Digest-pinned Grype v0.118.0 Linux amd64 scanner image
        required: false
        type: string
        default: "docker.io/anchore/grype@sha256:461c87fefcd20d133f4d99db4623608637eecb439045f9fc8d6eebbb4149e766"

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.image }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and seal candidate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      metadata_artifact: ${{ steps.artifact-name.outputs.value }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      identity_sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve exact validation commit
        id: source
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True,
          ).stdout.strip()
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("checkout did not resolve to a full commit SHA")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as output:
              output.write(f"commit_sha={commit}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up pinned wheelhouse builder
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Build locked offline wheelhouse
        run: |
          set -euo pipefail
          rm -rf -- deploy/wheelhouse
          mkdir -p deploy/wheelhouse
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv export \
            --frozen \
            --no-group dev \
            --no-emit-project \
            --no-hashes \
            --output-file "$RUNNER_TEMP/release-requirements.txt"
          python -m pip wheel \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --requirement "$RUNNER_TEMP/release-requirements.txt" \
            --wheel-dir deploy/wheelhouse
          uv build --no-cache --wheel --out-dir deploy/wheelhouse
          python - <<'PY'
          import hashlib
          from pathlib import Path

          wheelhouse = Path("deploy/wheelhouse")
          wheels = sorted(wheelhouse.glob("*.whl"), key=lambda path: path.name)
          if not wheels:
              raise SystemExit("locked wheelhouse build produced no wheels")
          entries = []
          for wheel in wheels:
              if not wheel.is_file() or wheel.is_symlink() or not wheel.name.isascii():
                  raise SystemExit(f"unsafe wheelhouse output: {wheel.name!r}")
              entries.append(f"{hashlib.sha256(wheel.read_bytes()).hexdigest()}  {wheel.name}")
          (wheelhouse / "SHA256SUMS").write_text(
              "\n".join(entries) + "\n", encoding="ascii",
          )
          PY

      - name: Acquire digest-pinned scanners
        env:
          GRYPE_IMAGE: ${{ inputs.grype_image }}
          SYFT_IMAGE: ${{ inputs.syft_image }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          allowed = {
              "GRYPE_IMAGE": {"anchore/grype", "docker.io/anchore/grype"},
              "SYFT_IMAGE": {"anchore/syft", "docker.io/anchore/syft"},
          }
          for variable, repositories in allowed.items():
              value = os.environ[variable]
              repository, separator, digest = value.rpartition("@")
              if (not separator or repository not in repositories
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None):
                  raise SystemExit(f"{variable} must use the official image pinned by digest")
          PY
          docker pull "$SYFT_IMAGE"
          docker pull "$GRYPE_IMAGE"

      - name: Build, validate, and seal release image
        env:
          GRYPE_IMAGE: ${{ inputs.grype_image }}
          IMAGE: ${{ inputs.image }}
          PYTHON_BASE: ${{ inputs.python_base }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit_sha }}
          SYFT_IMAGE: ${{ inputs.syft_image }}
          VERSION: ${{ inputs.version }}
        run: |
          python deploy/build_release_image.py \
            --mode build \
            --version "$VERSION" \
            --image "$IMAGE" \
            --python-base "$PYTHON_BASE" \
            --syft-image "$SYFT_IMAGE" \
            --grype-image "$GRYPE_IMAGE" \
            --expected-commit "$SOURCE_COMMIT" \
            --output release-image-metadata.json \
            --identity release-image-identity.json \
            --image-archive release-image.tar

      - name: Bind sealed identity to validation outputs
        id: identity
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          path = Path("release-image-identity.json")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("identity manifest is missing or unsafe")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("identity manifest digest is malformed")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as output:
              output.write(f"sha256={digest}\n")
          PY

      - name: Name validation artifact
        id: artifact-name
        run: echo "value=release-image-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload sealed candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            release-image.tar
            release-image-metadata.json
            release-image-identity.json
            release-image-evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  publish:
    name: Publish approved sealed candidate
    needs: validate
    if: ${{ inputs.push && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: menhir-release-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      metadata_artifact: ${{ steps.artifact-name.outputs.value }}
      image_ref: ${{ steps.release.outputs.image_ref }}
      registry_digest: ${{ steps.release.outputs.registry_digest }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download sealed validation candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate.outputs.metadata_artifact }}
          path: release-candidate

      - name: Verify identity, evidence, and loaded image before login
        env:
          EXPECTED_IDENTITY_SHA256: ${{ needs.validate.outputs.identity_sha256 }}
          IMAGE: ${{ inputs.image }}
          PYTHON_BASE: ${{ inputs.python_base }}
          VERSION: ${{ inputs.version }}
        run: |
          python deploy/build_release_image.py \
            --mode verify \
            --version "$VERSION" \
            --image "$IMAGE" \
            --python-base "$PYTHON_BASE" \
            --metadata release-candidate/release-image-metadata.json \
            --identity release-candidate/release-image-identity.json \
            --image-archive release-candidate/release-image.tar \
            --expected-identity-sha256 "$EXPECTED_IDENTITY_SHA256"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact candidate digest
        env:
          EXPECTED_IDENTITY_SHA256: ${{ needs.validate.outputs.identity_sha256 }}
          IMAGE: ${{ inputs.image }}
          PYTHON_BASE: ${{ inputs.python_base }}
          VERSION: ${{ inputs.version }}
        run: |
          python deploy/build_release_image.py \
            --mode publish \
            --version "$VERSION" \
            --image "$IMAGE" \
            --python-base "$PYTHON_BASE" \
            --metadata release-candidate/release-image-metadata.json \
            --identity release-candidate/release-image-identity.json \
            --image-archive release-candidate/release-image.tar \
            --expected-identity-sha256 "$EXPECTED_IDENTITY_SHA256" \
            --output release-image-publication.json

      - name: Bind publication outputs to verified metadata
        id: release
        env:
          EXPECTED_IMAGE: ${{ inputs.image }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads(Path("release-image-publication.json").read_text(encoding="ascii"))
          digest = metadata.get("registry_digest")
          image_ref = metadata.get("image_ref")
          archive_sha256 = metadata.get("image_archive_sha256")
          candidate_tag = metadata.get("candidate_tag")
          candidate_ref = metadata.get("candidate_ref")
          image_tag = metadata.get("image_tag")
          if metadata.get("schema") != 2:
              raise SystemExit("publication metadata schema is unsupported")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("publication metadata has no registry manifest digest")
          if not isinstance(archive_sha256, str) or re.fullmatch(r"[0-9a-f]{64}", archive_sha256) is None:
              raise SystemExit("publication metadata has no image archive digest")
          expected = f"{os.environ['EXPECTED_IMAGE']}@{digest}"
          if image_ref != expected:
              raise SystemExit("publication metadata image reference does not match inputs")
          expected_image_tag = f"{os.environ['EXPECTED_IMAGE']}:{os.environ['EXPECTED_VERSION']}"
          if image_tag != expected_image_tag:
              raise SystemExit("publication metadata validation tag does not match inputs")
          expected_candidate_tag = f"{os.environ['EXPECTED_IMAGE']}:candidate-{archive_sha256}"
          if candidate_tag != expected_candidate_tag:
              raise SystemExit("publication metadata candidate tag is not archive-bound")
          if candidate_ref != f"{candidate_tag}@{digest}":
              raise SystemExit("publication metadata candidate reference is not digest-bound")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as output:
              output.write(f"registry_digest={digest}\n")
              output.write(f"image_ref={image_ref}\n")
          PY

      - name: Name publication metadata artifact
        id: artifact-name
        run: echo "value=release-image-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload publication metadata and bound evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            release-image-publication.json
            release-candidate/release-image-metadata.json
            release-candidate/release-image-identity.json
            release-candidate/release-image-evidence/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: Attest published image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.release.outputs.registry_digest }}
          push-to-registry: true

      - name: Attest publication metadata
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-image-publication.json
