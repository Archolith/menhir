name: release image

on:
  workflow_call:
    inputs:
      version:
        description: Release version and image tag (<major>.<minor>.<patch>-<sequence>)
        required: true
        type: string
      image:
        description: GHCR image repository without a tag or digest
        required: true
        type: string
      ref:
        description: Git ref to build; defaults to the triggering commit
        required: false
        type: string
        default: ""
      python_base:
        description: Digest-pinned Python base image
        required: true
        type: string
      push:
        description: Publish after validation and environment approval
        required: false
        type: boolean
        default: false
      sbom_path:
        description: Optional repository-relative SBOM file to retain with metadata
        required: false
        type: string
        default: ""
      scan_path:
        description: Optional repository-relative scan result to retain with metadata
        required: false
        type: string
        default: ""
    outputs:
      validation_metadata_artifact:
        description: Artifact containing no-push validation metadata and optional evidence
        value: ${{ jobs.validate.outputs.metadata_artifact }}
      publication_metadata_artifact:
        description: Artifact containing publication metadata and optional evidence
        value: ${{ jobs.publish.outputs.metadata_artifact }}
      image_ref:
        description: Published digest-pinned image reference; empty when push is false
        value: ${{ jobs.publish.outputs.image_ref }}
      registry_digest:
        description: Published registry manifest digest; empty when push is false
        value: ${{ jobs.publish.outputs.registry_digest }}
  workflow_dispatch:
    inputs:
      version:
        description: Release version and image tag (<major>.<minor>.<patch>-<sequence>)
        required: true
        type: string
      image:
        description: GHCR image repository without a tag or digest
        required: true
        type: string
      ref:
        description: Git ref to build; defaults to the triggering commit
        required: false
        type: string
        default: ""
      python_base:
        description: Digest-pinned Python base image
        required: true
        type: string
      push:
        description: Publish after validation and environment approval
        required: false
        type: boolean
        default: false
      sbom_path:
        description: Optional repository-relative SBOM file to retain with metadata
        required: false
        type: string
        default: ""
      scan_path:
        description: Optional repository-relative scan result to retain with metadata
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      metadata_artifact: ${{ steps.artifact-name.outputs.value }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate GHCR repository input
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          python - <<'PY'
          import os

          image = os.environ["IMAGE"]
          remainder = image.removeprefix("ghcr.io/")
          if remainder == image or "/" not in remainder or "@" in image or ":" in remainder:
              raise SystemExit("image must be an untagged ghcr.io repository")
          PY

      - name: Build and validate release image without push
        env:
          IMAGE: ${{ inputs.image }}
          PYTHON_BASE: ${{ inputs.python_base }}
          VERSION: ${{ inputs.version }}
        run: |
          python deploy/build_release_image.py \
            --version "$VERSION" \
            --image "$IMAGE" \
            --python-base "$PYTHON_BASE" \
            --output release-image-metadata.json

      - name: Validate optional evidence inputs
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          for variable in ("SBOM_PATH", "SCAN_PATH"):
              value = os.environ[variable].strip()
              if not value:
                  continue
              candidate = (root / value).resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  raise SystemExit(f"{variable} must remain inside the checkout")
              if not candidate.is_file():
                  raise SystemExit(f"{variable} does not name a regular file")
          PY

      - name: Name validation metadata artifact
        id: artifact-name
        run: echo "value=release-image-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload validation metadata and optional evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            release-image-metadata.json
            ${{ inputs.sbom_path }}
            ${{ inputs.scan_path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish:
    name: Publish approved release image
    needs: validate
    if: ${{ inputs.push && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: menhir-release-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      metadata_artifact: ${{ steps.artifact-name.outputs.value }}
      image_ref: ${{ steps.release.outputs.image_ref }}
      registry_digest: ${{ steps.release.outputs.registry_digest }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate GHCR repository input
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          python - <<'PY'
          import os

          image = os.environ["IMAGE"]
          remainder = image.removeprefix("ghcr.io/")
          if remainder == image or "/" not in remainder or "@" in image or ":" in remainder:
              raise SystemExit("image must be an untagged ghcr.io repository")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate, and push release image
        env:
          IMAGE: ${{ inputs.image }}
          PYTHON_BASE: ${{ inputs.python_base }}
          VERSION: ${{ inputs.version }}
        run: |
          python deploy/build_release_image.py \
            --version "$VERSION" \
            --image "$IMAGE" \
            --python-base "$PYTHON_BASE" \
            --output release-image-metadata.json \
            --push

      - name: Bind publication outputs to builder metadata
        id: release
        env:
          EXPECTED_IMAGE: ${{ inputs.image }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads(Path("release-image-metadata.json").read_text(encoding="ascii"))
          digest = metadata.get("registry_digest")
          image_ref = metadata.get("image_ref")
          expected = f"{os.environ['EXPECTED_IMAGE']}:{os.environ['EXPECTED_VERSION']}@{digest}"
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("builder metadata has no registry manifest digest")
          if image_ref != expected:
              raise SystemExit("builder metadata image reference does not match workflow inputs")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"registry_digest={digest}\n")
              output.write(f"image_ref={image_ref}\n")
          PY

      - name: Validate optional evidence inputs
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          for variable in ("SBOM_PATH", "SCAN_PATH"):
              value = os.environ[variable].strip()
              if not value:
                  continue
              candidate = (root / value).resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  raise SystemExit(f"{variable} must remain inside the checkout")
              if not candidate.is_file():
                  raise SystemExit(f"{variable} does not name a regular file")
          PY

      - name: Name publication metadata artifact
        id: artifact-name
        run: echo "value=release-image-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload publication metadata and optional evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            release-image-metadata.json
            ${{ inputs.sbom_path }}
            ${{ inputs.scan_path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Attest published image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.release.outputs.registry_digest }}
          push-to-registry: true

      - name: Attest publication metadata
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-image-metadata.json
