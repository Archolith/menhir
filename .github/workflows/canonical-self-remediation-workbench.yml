name: canonical-self remediation workbench

on:
  push:
    branches: [workbench/canonical-self-remediation-20260905]
    paths: [.github/workflows/canonical-self-remediation-workbench.yml]

permissions:
  contents: write

jobs:
  verify-and-publish-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify patch bytes and apply to exact reviewed parent
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/canonical-self-remediation.patch.gz.b64.part{i}').read_text().strip() for i in (1, 2))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e52ed383e3c665d92c85abc54318f31adf506ba9140804141cee2eb5413c0f66'
          (Path(os.environ['RUNNER_TEMP']) / 'remediation.patch').write_bytes(patch)
          PY
          git checkout --detach d1a4bb4f368d6af397dcc15ebc180b952265dc7f
          git apply --check --index "${RUNNER_TEMP}/remediation.patch"
          git apply --index "${RUNNER_TEMP}/remediation.patch"
          test "$(git write-tree)" = 4d47058d3764dbc681c3d4fb337e89ec2995d8f5
          git diff --cached --stat
      - name: Install offline-test dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-xdist pytest-timeout ruff
      - name: Lint, compile and check exact staged diff
        run: |
          set -euo pipefail
          ruff check --select F811 --output-format concise .
          ruff check --select F821,ASYNC --output-format concise src
          python -m compileall -q src tests scripts/dev/test_server.py
          git diff --cached --check
      - name: Run full serial offline suite
        run: python -m pytest -q --junitxml="${RUNNER_TEMP}/offline-results.xml"
      - name: Publish only the reviewed follow-up branch
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 4d47058d3764dbc681c3d4fb337e89ec2995d8f5
          remote_ref="$(git ls-remote --heads origin refs/heads/fix/canonical-self-review-followups-20260905)"
          test -z "$remote_ref"
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git commit -m "fix(self): close mixed-payload and cross-turn authority gaps"
          git push origin HEAD:refs/heads/fix/canonical-self-review-followups-20260905
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-self-offline-verification
          path: ${{ runner.temp }}/offline-results.xml
          retention-days: 3
          if-no-files-found: ignore
