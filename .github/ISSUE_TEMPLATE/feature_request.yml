name: Feature request
description: A change to what Menhir does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where Menhir gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Menhir to do. Alternatives you considered are welcome.
    validations:
      required: true
