# Menhir TEST deployment.
#
# Phase 1 (default): auth-only scope — NO Neo4j, no data. Serves the
# auth/OAuth surface only, for validating the proxied-deployment guards
# (CT-001 forwarding-header bootstrap guard, RL-001 trusted-proxy rate limits)
# and the OAuth challenge/DCR flows behind a real reverse proxy.
#
# Phase 2 (commented): full mode with a throwaway Neo4j, for exercising the
# memory backend too. Uncomment the neo4j-test service and the marked lines.
#
# This is a TEST stack: isolated data volume, its own port, no shared database.
# Do not point it at any production Neo4j/Postgres.

services:
  menhir-test:
    image: menhir:test
    # Build from the repo root; the image is self-contained. New-user flow from a
    # menhir clone:
    #   docker compose -f deploy/docker-compose.test.yml up -d --build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: menhir-test
    restart: unless-stopped
    environment:
      MENHIR_STARTUP_SCOPE: auth-only        # phase 1: no backend. Phase 2: full
      MENHIR_CLIENT_TOKENS_ENABLED: "1"      # per-client token tier (CT-001 target)
      MENHIR_OPERATOR_KEY: ${MENHIR_OPERATOR_KEY:?Set MENHIR_OPERATOR_KEY before starting the stack}
      MENHIR_TRUSTED_PROXY: "1"              # RL-001: key rate limits on the proxy's XFF last hop
      MENHIR_API_HOST: 0.0.0.0
      MENHIR_API_PORT: "8099"
      MENHIR_OAUTH_AS_DIR: /data             # client_tokens.db / AS stores live here
      # --- OAuth resource-server mode instead of client-token (optional) ---
      # MENHIR_OAUTH_ENABLED: "true"
      # MENHIR_PUBLIC_BASE_URL: "https://menhir-test.example.com"
      # MENHIR_OAUTH_ISSUER: "https://<your-idp>/"
      # MENHIR_OAUTH_JWKS_URI: "https://<your-idp>/.well-known/jwks.json"
      # MENHIR_OAUTH_AUDIENCE: "https://menhir-test.example.com/mcp-http"
      # --- Phase 2: full mode (uncomment with neo4j-test below) ---
      # MENHIR_STARTUP_SCOPE: full
      # NEO4J_URI: bolt://neo4j-test:7687
      # NEO4J_USER: neo4j
      # NEO4J_PASSWORD: testthrowaway
    volumes:
      - menhir_test_data:/data
    # Publish on loopback only: the reverse proxy (caddy) reaches it, the
    # public internet does not hit the app port directly.
    ports:
      - "127.0.0.1:8099:8099"
    # depends_on: [neo4j-test]   # phase 2

  # --- Phase 2: throwaway Neo4j (uncomment to enable full mode) ---
  # neo4j-test:
  #   image: neo4j:5-community
  #   container_name: menhir-test-neo4j
  #   restart: unless-stopped
  #   environment:
  #     NEO4J_AUTH: neo4j/testthrowaway # gitleaks:allow — local test credential
  #     NEO4J_PLUGINS: '["apoc"]'
  #   volumes:
  #     - menhir_test_neo4j:/data

volumes:
  menhir_test_data:
  # menhir_test_neo4j:
