# Menhir FULL test deployment: menhir + an isolated throwaway Neo4j.
#
# startup_mode=full requires Neo4j + an embedder + an LLM (for graphiti
# enrichment). This stack wires menhir to its own Neo4j and to an OpenAI
# provider (chat + embeddings). It is a TEST stack — isolated volumes, own
# ports, its own Neo4j — never point it at a production graph.
#
# Secrets: OPENAI_API_KEY comes from an uncommitted env file. Copy
# .env.deploy.example -> .env.deploy and fill it in (it is gitignored).
#
# Bring up:
#   docker compose -f deploy/docker-compose.full.yml up -d --build
#   docker compose -f deploy/docker-compose.full.yml logs -f menhir
# Health -> full:
#   curl -fsS http://127.0.0.1:8099/api/health   # {"status":"ok",...,"startup_mode":"full"}

services:
  neo4j:
    image: neo4j:5-community
    container_name: menhir-full-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/testthrowaway # gitleaks:allow — local test credential
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - menhir_full_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  menhir:
    image: menhir:test
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: menhir-full
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - .env.deploy          # OPENAI_API_KEY (uncommitted; see .env.deploy.example)
    environment:
      MENHIR_STARTUP_SCOPE: full
      MENHIR_ALLOW_SYSTEM_PYTHON: "1"   # pip-installed in the image; not a project .venv
      MENHIR_API_HOST: 0.0.0.0
      MENHIR_API_PORT: "8099"
      MENHIR_OAUTH_AS_DIR: /data
      # --- auth: client-token tier (network bind -> use MENHIR_OPERATOR_KEY, see README) ---
      MENHIR_CLIENT_TOKENS_ENABLED: "1"
      MENHIR_TRUSTED_PROXY: "1"
      # --- backend ---
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testthrowaway
      # --- LLM + embedder (graphiti enrichment) ---
      LLM_CHAT_PROVIDER: openai
      GRAPHITI_LLM_PROVIDER: openai
      GRAPHITI_EMBED_PROVIDER: openai
      OPENAI_CHAT_MODEL: gpt-4.1-nano
      OPENAI_EMBED_MODEL: text-embedding-3-small
    volumes:
      - menhir_full_data:/data
    ports:
      - "127.0.0.1:8099:8099"   # loopback only; reverse proxy fronts it

volumes:
  menhir_full_neo4j:
  menhir_full_data:
